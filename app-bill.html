    <style>
      .bills-list {
        padding: 20px 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .bill-row {
        background: white;
        border-radius: 16px;
        padding: 18px 20px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .bill-row-info {
        flex: 1;
        min-width: 0;
      }
      .bill-row-clinic {
        font-size: 14px;
        font-weight: 700;
        color: #0f2027;
      }
      .bill-row-sub {
        font-size: 12px;
        color: #888;
        margin-top: 3px;
      }
      .bill-row-amount {
        font-size: 15px;
        font-weight: 700;
        color: #35bac9;
      }
      .status-chip {
        font-size: 10px;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 12px;
        text-transform: uppercase;
      }
      .status-PAID {
        background: #d1fae5;
        color: #065f46;
      }
      .status-WAIVED {
        background: #e0e7ff;
        color: #4338ca;
      }
      .status-PART_PAID {
        background: #dbeafe;
        color: #1e40af;
      }
      .status-UNPAID {
        background: #fef3c7;
        color: #b45309;
      }
      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: #888;
      }
    </style>

    <main
      class="main"
      style="min-height: 100vh; background: #7ecad7; padding-top: 80px"
    >
      <div
        class="main-body"
        style="
          background: #f8fdfe;
          border-radius: 30px 30px 0 0;
          min-height: calc(100vh - 80px);
          padding: 30px 20px;
        "
      >
        <h1
          style="
            font-family: poppins, sans-serif;
            color: #0f2027;
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 6px;
          "
        >
          My Bills & Receipts
        </h1>
        <p style="color: #666; margin-bottom: 10px">
          All your visit bills across every clinic you've used.
        </p>

        <div id="billsList" class="bills-list">
          <div style="text-align: center; padding: 50px">
            <div class="spinner"></div>
          </div>
        </div>
      </div>
    </main>

    <script src="./script.js"></script>
    <script>
      var API_URL =
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1"
          ? "http://localhost:5000/api"
          : "https://novabuk-backend.onrender.com/api";

      async function loadMyBills() {
        const container = document.getElementById("billsList");
        const token = localStorage.getItem("novabuk_token");

        try {
          const res = await fetch(`${API_URL}/visits/bills/my`, {
            headers: { Authorization: `Bearer ${token}` },
            credentials: "include",
          });
          const data = await res.json();

          if (!data.success || !data.data.length) {
            container.innerHTML = `
              <div class="empty-state">
                <i class="fa-solid fa-receipt" style="font-size: 32px; opacity: 0.3; display: block; margin-bottom: 12px;"></i>
                <p>No bills yet. Bills appear here after a doctor completes your visit.</p>
              </div>`;
            return;
          }

          container.innerHTML = data.data
            .map((bill) => {
              const balance = bill.totalAmount - bill.amountPaid;
              const isSettled = ["PAID", "WAIVED"].includes(bill.paymentStatus);
              return `
              <div class="bill-row">
                <div class="bill-row-info">
                  <div class="bill-row-clinic">${bill.clinic?.name || "Clinic"}</div>
                  <div class="bill-row-sub">${bill.visit?.visitType || "General"} · ${new Date(bill.createdAt).toLocaleDateString("en-NG", { day: "numeric", month: "short", year: "numeric" })}</div>
                </div>
                <span class="status-chip status-${bill.paymentStatus}">${bill.paymentStatus.replace("_", " ")}</span>
                <div style="text-align:right;">
                  <div class="bill-row-amount">\u20a6${bill.totalAmount.toLocaleString()}</div>
                  ${!isSettled ? `<div style="font-size:11px; color:#b45309;">Due: \u20a6${balance.toLocaleString()}</div>` : ""}
                </div>
                ${
                  isSettled
                    ? `<button onclick="downloadReceipt('${bill._id}')" style="background:none; border:1px solid #35bac9; color:#35bac9; border-radius:8px; padding:6px 12px; font-size:12px; cursor:pointer;"><i class="fa-solid fa-download"></i></button>`
                    : ""
                }
              </div>`;
            })
            .join("");
        } catch (err) {
          console.error("Load bills error:", err);
          container.innerHTML = `<div class="empty-state"><p style="color:#e53e3e;">Failed to load your bills. Please try again.</p></div>`;
        }
      }

      async function downloadReceipt(billId) {
        const token = localStorage.getItem("novabuk_token");
        try {
          const res = await fetch(`${API_URL}/visits/bills/${billId}/receipt`, {
            headers: { Authorization: `Bearer ${token}` },
            credentials: "include",
          });
          if (!res.ok) throw new Error(`Server responded ${res.status}`);
          const blob = await res.blob();
          // An <a download> click (rather than window.open in an async
          // callback) isn't subject to popup-blocker timing, and gives
          // a real downloaded file with a proper name.
          const blobUrl = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = blobUrl;
          a.download = `receipt-${billId}.pdf`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
        } catch (err) {
          console.error("Download receipt error:", err);
          alert("Could not load your receipt. Please try again.");
        }
      }

      loadMyBills();
    </script>
  </body>
</html>
