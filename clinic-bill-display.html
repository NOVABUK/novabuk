<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Bill — NovaBuk</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #0f2027, #1a3a4a);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }
      .bill-card {
        background: white;
        border-radius: 24px;
        max-width: 520px;
        width: 100%;
        padding: 48px 44px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      }
      .clinic-name { font-size: 22px; font-weight: 700; color: #0f2027; text-align: center; }
      .clinic-address { font-size: 13px; color: #888; text-align: center; margin-top: 4px; }
      .divider { height: 1px; background: #eee; margin: 28px 0; }
      .patient-row { display: flex; justify-content: space-between; font-size: 14px; color: #555; margin-bottom: 8px; }
      .line-item {
        display: flex; justify-content: space-between;
        font-size: 15px; padding: 12px 0; border-bottom: 1px solid #f5f5f5;
      }
      .total-row {
        display: flex; justify-content: space-between;
        font-size: 26px; font-weight: 800; color: #0f2027;
        margin-top: 20px; padding-top: 20px; border-top: 2px solid #0f2027;
      }
      .balance-note {
        text-align: center; font-size: 13px; color: #b45309;
        background: #fef3c7; padding: 10px; border-radius: 10px; margin-top: 16px;
      }
      .paid-note {
        text-align: center; font-size: 14px; font-weight: 600; color: #2f855a;
        background: #f0fff4; padding: 12px; border-radius: 10px; margin-top: 16px;
      }
      .footer-note { text-align: center; font-size: 11px; color: #aaa; margin-top: 32px; }
      .loading { text-align: center; color: #888; font-size: 14px; padding: 60px 0; }
    </style>
  </head>
  <body>
    <div class="bill-card" id="billCard">
      <div class="loading">Loading bill…</div>
    </div>

    <script>
      var API_URL =
        window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
          ? "http://localhost:5000/api"
          : "https://novabuk-backend.onrender.com/api";

      const billId = new URLSearchParams(window.location.search).get("billId");
      const token = localStorage.getItem("novabuk_token");

      async function loadBill() {
        const card = document.getElementById("billCard");

        if (!billId) {
          card.innerHTML = `<p style="text-align:center; color:#e53e3e;">No bill specified.</p>`;
          return;
        }

        try {
          const res = await fetch(`${API_URL}/clinic/bills/${billId}`, {
            headers: { Authorization: `Bearer ${token}` },
            credentials: "include",
          });
          const data = await res.json();

          if (!data.success) {
            card.innerHTML = `<p style="text-align:center; color:#e53e3e;">Could not load this bill.</p>`;
            return;
          }

          const bill = data.data;
          const balance = bill.totalAmount - bill.amountPaid;
          const isSettled = ["PAID", "WAIVED"].includes(bill.paymentStatus);

          card.innerHTML = `
            <div class="clinic-name">${bill.clinic?.name || "NovaBuk Clinic"}</div>
            ${bill.clinic?.location?.address ? `<div class="clinic-address">${bill.clinic.location.address}</div>` : ""}
            <div class="divider"></div>
            <div class="patient-row"><span>Patient</span><span>${bill.patient.fullName}</span></div>
            <div class="patient-row"><span>Visit Type</span><span>${bill.visit?.visitType || "General"}</span></div>
            <div class="patient-row"><span>Date</span><span>${new Date(bill.createdAt).toLocaleDateString("en-NG", { day: "numeric", month: "long", year: "numeric" })}</span></div>
            <div class="divider"></div>
            ${bill.lineItems
              .map((item) => `<div class="line-item"><span>${item.description}</span><span>\u20a6${item.lineTotal.toLocaleString()}</span></div>`)
              .join("")}
            <div class="total-row"><span>Total</span><span>\u20a6${bill.totalAmount.toLocaleString()}</span></div>
            ${
              isSettled
                ? `<div class="paid-note">✓ ${bill.paymentStatus === "WAIVED" ? "Waived" : "Paid in Full"}</div>`
                : balance < bill.totalAmount
                  ? `<div class="balance-note">Balance Due: \u20a6${balance.toLocaleString()}</div>`
                  : `<div class="balance-note">Amount Due: \u20a6${balance.toLocaleString()}</div>`
            }
            <div class="footer-note">Powered by NovaBuk — Healthcare, Simplified.</div>
          `;

          // Auto-refresh every 10s so the display updates the moment
          // the receptionist records payment on the other screen —
          // no manual refresh needed at the counter.
          setTimeout(loadBill, 10000);
        } catch (err) {
          card.innerHTML = `<p style="text-align:center; color:#e53e3e;">Network error loading bill.</p>`;
        }
      }

      loadBill();
    </script>
  </body>
</html>
